{{- define "main" }}

{{- if not .IsHome | and .Title }}
<header class="page-header">
  <h1>{{ .Title }}</h1>
  {{- if .Description }}
  <div class="post-description">
    {{ .Description }}
  </div>
  {{- end }}
</header>
{{- end }}

<br />

<section class="notes">

{{ partial "notes-map.html" . }}

<br />

    {{- range .Pages }}
        <article>
        	<span><a href="{{.Permalink}}">{{.Title}}</a></span><span>{{.Date.Format "02 Jan 2006"}}</span>
        </article>
    {{- end }}
</section>

{{- end }}{{- /* end main */ -}}
