{{- /* Standalone images match the figure shortcode:
  ![alt](file.png "caption")
  {class="full"}
*/ -}}
{{- $src := .Destination -}}
{{- with .Page.Resources.Get $src }}{{ $src = .Permalink }}{{ end -}}
{{- if .IsBlock -}}
<figure{{ with .Attributes.class }} class="{{ . }}"{{ end }}>
    <img loading="lazy" src="{{ $src | safeURL }}" alt="{{ .PlainText }}" />
    {{- with .Title }}
    <figcaption><p>{{ . | markdownify }}</p></figcaption>
    {{- end }}
</figure>
{{- else -}}
<img loading="lazy" src="{{ $src | safeURL }}" alt="{{ .Text }}" {{ with .Title}} title="{{ . }}" {{ end }} />
{{- end -}}
