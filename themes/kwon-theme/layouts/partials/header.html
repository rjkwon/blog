<script>
    const prefTheme = localStorage.getItem("pref-theme");
    if (prefTheme === "dark" || (!prefTheme && window.matchMedia("(prefers-color-scheme: dark)").matches)) {
        document.body.classList.add("dark");
    }
</script>
<noscript>
    <style>
        #theme-toggle,
        .top-link {
            display: none;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --theme: #1d1e20;
                --entry: #2e2e33;
                --primary: rgba(255, 255, 255, 0.84);
                --secondary: rgba(255, 255, 255, 0.56);
                --tertiary: rgba(255, 255, 255, 0.16);
                --content: rgba(255, 255, 255, 0.74);
                --hljs-bg: #2e2e33;
                --code-bg: #37383e;
                --border: #333;
            }

            .list {
                background: var(--theme);
            }
        }
    </style>
</noscript>
<header class="header">
    <nav class="nav">
        <div class="logo">
            <img src="/images/logo.svg" alt="권" /> 
            {{ block "title" . }}
            <a href="{{ "" | absLangURL }}">{{ .Site.Title }}</a>
            {{ end }}
        </div>
        {{- $currentPage := . }}
        <ul id="menu">
            {{- range .Site.Menus.main }}
            {{- $menu_item_url := (cond (strings.HasSuffix .URL "/") .URL (printf "%s/" .URL) ) | absLangURL }}
            {{- $page_url:= $currentPage.Permalink  | absLangURL }}
            <li>
                <a href="{{ .URL | absLangURL }}" title="{{ .Title | default .Name }}">
                    <span {{- if eq $menu_item_url $page_url }} class="active" {{- end }}>
                        {{- .Name -}}
                    </span>
                </a>
            </li>
            {{- end -}}
            <li>
                <span class="logo-switches">
                <button id="theme-toggle" accesskey="t" title="(Alt + T)">
                    <span id="moon">🕶</span>
                    <span id="sun">💡</span>
                </button>
                </span>
            </li>
        </ul>
    </nav>
</header>
