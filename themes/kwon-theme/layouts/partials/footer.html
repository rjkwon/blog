<a href="#top" aria-label="go to top" title="Go to Top (Alt + G)">
    <button class="top-link" id="top-link" type="button" accesskey="g">☝️
    </button>
</a>
<script>
    const topLink = document.getElementById("top-link");
    window.onscroll = function () {
        const scrolled = document.documentElement.scrollTop > 800;
        topLink.style.visibility = scrolled ? "visible" : "hidden";
        topLink.style.opacity = scrolled ? "1" : "0";
    };

    document.getElementById("theme-toggle").addEventListener("click", () => {
        const dark = document.body.classList.toggle("dark");
        localStorage.setItem("pref-theme", dark ? "dark" : "light");
    });
</script>
