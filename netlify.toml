[build]
  publish = "public"
  command = "npm run build"

[build.environment]
  HUGO_VERSION = "0.142.0"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    # Stops other sites from embedding pages in an iframe (e.g. to trick people into using the guestbook form)
    Content-Security-Policy = "frame-ancestors 'self'"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=()"

# Runs first so it also records the curl-detector response on /
[[edge_functions]]
  function = "bot-detection"
  path = "/*"

[[edge_functions]]
  function = "curl-detector"
  path = "/"